name: eventra
description: "A new Flutter project."


version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  go_router: ^14.8.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  ai_barcode_scanner: ^6.0.1
  shared_preferences: ^2.5.2
  google_maps_flutter: ^2.10.1
  icons_plus: ^5.0.0
  iconsax: ^0.0.8


  # Helper
  intl: ^0.19.0
  fluttertoast: ^8.2.12
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.3
  flutter_local_notifications: ^18.0.1

  #UI
  cupertino_icons: ^1.0.8
  introduction_screen: ^3.1.17
  smooth_page_indicator: ^1.2.1
  syncfusion_flutter_calendar: ^28.2.7

  # Controller
  flutter_bloc: ^9.0.0

  # Firebase
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  googleapis_auth: ^1.6.0
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.2
  omni_datetime_picker: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/files/
    - assets/icons/
    - assets/images/
    - assets/images/banners/

  # fonts:
